server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip — bundle JS/CSS 400KB+ jadi ~30% ukuran asli. Wajib untuk LAN lambat/WiFi.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2 application/xml;

    # WAJIB untuk React + Vite + React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Jangan cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
