worker_processes      auto;
worker_rlimit_nofile  65535;

events {
  worker_connections  4096;
  multi_accept        on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ── Logging ────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log main buffer=16k flush=5m;
  error_log   /var/log/nginx/error.log warn;

  # ── Performance ────────────────────────────────────────────────────────────
  sendfile          on;
  tcp_nopush        on;
  tcp_nodelay       on;
  keepalive_timeout 65;
  server_tokens     off;

  # ── Upload ─────────────────────────────────────────────────────────────────
  client_max_body_size    100M;
  client_body_buffer_size 128k;

  # ── Proxy buffers (global default) ─────────────────────────────────────────
  proxy_buffering         on;
  proxy_buffer_size       4k;
  proxy_buffers           8 16k;
  proxy_busy_buffers_size 32k;

  # ── Gzip ───────────────────────────────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/rss+xml application/atom+xml image/svg+xml;

  # ── Upstreams ──────────────────────────────────────────────────────────────
  upstream api_backend {
    server timesheet-api:3001;
    keepalive 32;
  }

  upstream frontend_app {
    server timesheet-frontend:80;
    keepalive 16;
  }

  upstream fastapi_backend {
    server fastapi:8000;
    keepalive 16;
  }

  # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS server ───────────────────────────────────────────────────────────
  server {
    listen 443 ssl; 
    http2 on;
    server_name _;

    # SSL certificate
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # SSL hardening
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Uploaded progress photos (served directly, bypass API) ────────────
    location ^~ /uploads/ {
      alias /uploads/;
      try_files $uri =404;
      expires 7d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # ── API routes ─────────────────────────────────────────────────────────
    # Semua route Express cukup tambahkan di server.js — nginx tidak perlu diubah.
    location /api/ {
      rewrite               ^/api/(.*)$ /$1 break;
      proxy_pass            http://api_backend;
      proxy_http_version    1.1;
      proxy_set_header      Upgrade           $http_upgrade;
      proxy_set_header      Connection        $connection_upgrade;
      proxy_set_header      Host              $host;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;

  proxy_connect_timeout 60s;
  proxy_send_timeout    300s;
  proxy_read_timeout    300s;
    }

    # ── FastAPI routes ─────────────────────────────────────────────────────
    location /fastapi/ {
      rewrite               ^/fastapi/(.*)$ /$1 break;
      proxy_pass            http://fastapi_backend;
      proxy_http_version    1.1;
      proxy_set_header      Connection        "";
      proxy_set_header      Host              $host;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;

      proxy_connect_timeout 60s;
      proxy_send_timeout    120s;
      proxy_read_timeout    600s;
    }

    # ── Static assets (long-term cache) ───────────────────────────────────
    location /tts/ {
      proxy_pass            http://fastapi_backend;
      proxy_http_version    1.1;
      proxy_set_header      Connection        "";
      proxy_set_header      Host              $host;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;

      proxy_connect_timeout 60s;
      proxy_send_timeout    120s;
      proxy_read_timeout    600s;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
      proxy_pass         http://frontend_app;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      expires            6M;
      access_log         off;
      add_header         Cache-Control "public, immutable";
    }

    # ── Service Worker (must not be cached) ───────────────────────────────
    location = /sw.js {
      proxy_pass         http://frontend_app;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host       $host;
      add_header         Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Web manifest ──────────────────────────────────────────────────────
    location = /manifest.webmanifest {
      proxy_pass         http://frontend_app;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_set_header   Host       $host;
    }

    # ── React SPA (catch-all) ─────────────────────────────────────────────
    location / {
      proxy_pass            http://frontend_app;
      proxy_http_version    1.1;
      proxy_set_header      Connection        "";
      proxy_set_header      Host              $host;
      proxy_set_header      X-Real-IP         $remote_addr;
      proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header      X-Forwarded-Proto $scheme;

      proxy_connect_timeout 10s;
      proxy_send_timeout    30s;
      proxy_read_timeout    60s;

      proxy_intercept_errors on;
      error_page 404 = @spa_fallback;
    }

    # Fallback for SPA deep-link routes (returns index.html)
    location @spa_fallback {
      proxy_pass         http://frontend_app;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
