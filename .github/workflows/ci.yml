name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint src/pages/MACHINE_H/SpcDashboardPage.jsx
      - run: npm run lint:tokens
      - run: npm run build

  python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r jobs/messaging/requirements.txt
      - run: python -m unittest discover -s jobs/messaging/tests -p "test_unit.py" -v
      - run: python -m unittest test_normalize_max_record
        working-directory: jobs/sap_staging

  kafka-integration:
    name: Kafka integration (real broker and PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iems_test
          POSTGRES_PASSWORD: iems_test
          POSTGRES_DB: iems_it
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U iems_test -d iems_it"
          --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        image: apache/kafka:3.9.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
        ports: ['9092:9092']
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 15
    env:
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      IEMS_TEST_DB_HOST: localhost
      IEMS_TEST_DB_PORT: 5432
      IEMS_TEST_DB_NAME: iems_it
      IEMS_TEST_DB_USER: iems_test
      IEMS_TEST_DB_PASSWORD: iems_test
      SAP_STAGING_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r jobs/messaging/requirements.txt
      - name: Create topics (also checks the broker is reachable)
        run: python jobs/messaging/create_topics.py
      - name: End-to-end tests
        run: python -m unittest discover -s jobs/messaging/tests -p "test_integration.py" -v
