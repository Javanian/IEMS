name: Portfolio VAT acceptance

on:
  push:
    paths:
      - 'apps/portfolio-api/**'
      - 'apps/web/**'
      - 'apps/wa-demo-bridge/**'
      - 'packages/**'
      - 'checkpoints/wave4h/**'
      - 'checkpoints/wave4j/**'
      - 'checkpoints/wave4k/**'
      - 'checkpoints/wave4k2a/**'
      - 'checkpoints/wave4k2b1/**'
      - 'checkpoints/wave4k2b2a/**'
      - 'checkpoints/wave4map/**'
      - 'checkpoints/wave4qc/**'
      - 'checkpoints/review-five-findings/**'
      - 'checkpoints/company-stock-use/**'
      - 'checkpoints/company-stock-trace/**'
      - 'checkpoints/quote-catalog-entitlement/**'
      - 'checkpoints/p2-f5a-dispatch-followup/**'
      - 'checkpoints/purchased-stock-fulfillment/**'
      - '.github/workflows/portfolio-vat.yml'
  pull_request:
    paths:
      - 'apps/portfolio-api/**'
      - 'apps/web/**'
      - 'apps/wa-demo-bridge/**'
      - 'packages/**'
      - 'checkpoints/wave4h/**'
      - 'checkpoints/wave4j/**'
      - 'checkpoints/wave4k/**'
      - 'checkpoints/wave4k2a/**'
      - 'checkpoints/wave4k2b1/**'
      - 'checkpoints/wave4k2b2a/**'
      - 'checkpoints/wave4map/**'
      - 'checkpoints/wave4qc/**'
      - 'checkpoints/review-five-findings/**'
      - 'checkpoints/company-stock-use/**'
      - 'checkpoints/company-stock-trace/**'
      - 'checkpoints/quote-catalog-entitlement/**'
      - 'checkpoints/p2-f5a-dispatch-followup/**'
      - 'checkpoints/purchased-stock-fulfillment/**'
      - '.github/workflows/portfolio-vat.yml'

permissions:
  contents: read

concurrency:
  group: portfolio-vat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vat:
    name: VAT API, PDF and connected browser
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1'
      MONGOMS_VERSION: '7.0.14'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/tenant-foundation/package-lock.json
            packages/customer-service/package-lock.json
            packages/document-rendering/package-lock.json
            apps/portfolio-api/package-lock.json
            apps/wa-demo-bridge/package-lock.json
            apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        shell: pwsh
        run: |
          foreach ($package in @('packages/tenant-foundation', 'packages/customer-service', 'packages/document-rendering', 'apps/portfolio-api', 'apps/wa-demo-bridge', 'apps/web')) {
            npm --prefix $package ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Audit publication manifest and imports
        run: python checkpoints/review-five-findings/audit-publication.py
      - name: Validate API syntax
        run: npm --prefix apps/portfolio-api run check
      - name: Check renderer public types
        run: npm --prefix packages/document-rendering run check
      - name: Test historical and VAT rendering
        run: npm --prefix packages/document-rendering test
      - name: Test frontend behavior
        run: npm --prefix apps/web run test:portfolio
      - name: Build web application
        run: npm --prefix apps/web run build
      - name: Test independent genealogy ordering and holds
        run: node --test --test-concurrency=1 checkpoints/wave4k/qa/hold-shipment-fence.test.mjs
      - name: Test independent received custody ordering
        run: node --test --test-concurrency=1 checkpoints/wave4k2a/qa/custody-ordering.test.mjs
      - name: Test independent received installation custody
        run: node --test --test-concurrency=1 checkpoints/wave4k2b1/qa/received-installation.test.mjs
      - name: Test independent internal planning authority
        run: node --test --test-concurrency=1 checkpoints/wave4k2b2a/qa/internal-planning-authority.test.mjs
      - name: Test independent catalog receipt boundaries
        run: node --test --test-concurrency=1 checkpoints/wave4map/qa/catalog-receipt-boundary.test.mjs
      - name: Test independent catalog QC and qualified putaway
        run: node --test --test-concurrency=1 checkpoints/wave4qc/qa/qc-putaway-authority.test.mjs
      - name: Test independent authorization, stock, picker and delivery evidence
        run: node --test --test-concurrency=1 checkpoints/review-five-findings/qa/authorization-ordering.test.mjs checkpoints/review-five-findings/qa/picker-search-authority.test.mjs checkpoints/review-five-findings/qa/internal-stock-execution.test.mjs checkpoints/review-five-findings/qa/delivery-evidence.test.mjs checkpoints/review-five-findings/qa/canonical-e01-review.test.mjs checkpoints/review-five-findings/qa/required-labor-proof.test.mjs
        env:
          IEMS_QA_EVIDENCE: ${{ runner.temp }}/iems-independent-evidence
      - name: Test guarded benchmark resume selection
        run: node --test checkpoints/review-five-findings/qa/benchmark-selection.test.mjs
      - name: Test independent one-generation company stock use
        run: node --test --test-concurrency=1 checkpoints/company-stock-use/qa/company-stock-use.test.mjs
        env:
          IEMS_QA_EVIDENCE: ${{ runner.temp }}/iems-company-stock-evidence
      - name: Test independent company unit trace
        run: node --test --test-concurrency=1 checkpoints/company-stock-trace/qa/company-stock-trace.test.mjs
        env:
          IEMS_QA_EVIDENCE: ${{ runner.temp }}/iems-company-trace-evidence
      - name: Test independent commercial catalog entitlement
        run: node --test --test-concurrency=1 checkpoints/quote-catalog-entitlement/qa/quote-catalog-entitlement.test.mjs
        env:
          IEMS_QA_EVIDENCE: ${{ runner.temp }}/iems-quote-catalog-evidence
      - name: Test independent company stock history readiness
        run: node --test --test-concurrency=1 checkpoints/p2-f5a-dispatch-followup/qa/company-stock-readiness.test.mjs
        env:
          IEMS_QA_EVIDENCE: ${{ runner.temp }}/iems-company-readiness-evidence
      - name: Test isolated F5-A authorization proof
        run: node --test --test-concurrency=1 --test-reporter=tap checkpoints/p2-f5a-dispatch-followup/f5a/owner.test.mjs checkpoints/p2-f5a-dispatch-followup/qa/f5a-authorization.test.mjs
        env:
          IEMS_QA_EVIDENCE: ${{ runner.temp }}/iems-f5a-proof
      - name: Retain isolated F5-A proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: f5a-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iems-f5a-proof/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Test independent purchased stock fulfillment
        run: node --test --test-concurrency=1 checkpoints/purchased-stock-fulfillment/qa/purchased-stock-fulfillment.test.mjs
        env:
          IEMS_QA_EVIDENCE: ${{ runner.temp }}/iems-purchased-fulfillment-evidence
      - name: Test connected browser workflow
        run: npm --prefix apps/web run test:portfolio:browser
        env:
          PORTFOLIO_PAGINATION: '1'
          PORTFOLIO_REPAIR: '1'
          PORTFOLIO_DOCUMENTS: '1'
          PORTFOLIO_WMS: '1'
          PORTFOLIO_ENGINEERING: '1'
          PORTFOLIO_LABOR: '1'
          PORTFOLIO_VAT: '1'
          PORTFOLIO_INQUIRY: '1'
          PORTFOLIO_LOT_SERIAL: '1'
          PORTFOLIO_GENEALOGY: '1'
          PORTFOLIO_SERIAL_CUSTODY: '1'
          PORTFOLIO_INSTALLATION: '1'
          PORTFOLIO_INTERNAL_PLANNING: '1'
          PORTFOLIO_CATALOG: '1'
          PORTFOLIO_CATALOG_QC: '1'
          PORTFOLIO_REVIEW_OPERATOR: '1'
          PORTFOLIO_INTERNAL_EXECUTION: '1'
          PORTFOLIO_COMPANY_STOCK: '1'
          PORTFOLIO_COMPANY_STOCK_TRACE: '1'
          PORTFOLIO_QUOTE_CATALOG: '1'
          PORTFOLIO_PURCHASED_FULFILLMENT: '1'
          PORTFOLIO_REVIEW_E01: '1'
          PORTFOLIO_REVIEW_DEBUG_ONLY: '0'
          PORTFOLIO_TEXT_DIAGNOSTIC_ONLY: '0'
          PORTFOLIO_COMPANY_STOCK_DIAGNOSTIC_ONLY: '0'
          PORTFOLIO_QUOTE_CATALOG_DIAGNOSTIC_ONLY: '0'
          PORTFOLIO_PURCHASED_FULFILLMENT_DIAGNOSTIC_ONLY: '0'
          PORTFOLIO_SKIP_CS: '0'
          PORTFOLIO_EVIDENCE_DIR: ${{ runner.temp }}/iems-native-browser
      - name: Test order planning production component with mocked HTTP
        run: node apps/web/test/portfolio-order-planning-browser.mjs
        env:
          PLANNING_EVIDENCE_DIR: ${{ runner.temp }}/iems-planning-mocked
      - name: Test order planning actual app API and disposable database
        run: node apps/web/test/portfolio-order-planning-e2e.mjs
        env:
          PLANNING_E2E_EVIDENCE_DIR: ${{ runner.temp }}/iems-planning-e2e
      - name: Retain order planning acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: order-planning-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/iems-planning-mocked/*.json
            ${{ runner.temp }}/iems-planning-mocked/*.png
            ${{ runner.temp }}/iems-planning-e2e/*.json
            ${{ runner.temp }}/iems-planning-e2e/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Test intentional module failure and native reload recovery
        run: node checkpoints/review-five-findings/qa/module-fetch-recovery-browser.mjs
        env:
          IEMS_QA_EVIDENCE: ${{ runner.temp }}/iems-module-fetch-recovery
      - name: Test maintained API contract
        run: npm --prefix apps/portfolio-api test
      - name: Retain synthetic browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/iems-native-browser/*.json
            ${{ runner.temp }}/iems-native-browser/*.png
          if-no-files-found: ignore
          retention-days: 7
