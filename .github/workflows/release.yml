name: Release CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker-publish:
    name: Build & publish Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
            image: iems-api
          - service: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
            image: iems-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  github-release:
    name: Publish GitHub Release & checksums
    needs: [docker-publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      OWNER_LC: ${{ github.repository_owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package source archive and SHA-256 checksums
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="iems-${TAG}/" -o "dist/iems-${TAG}-source.tar.gz" HEAD
          (cd dist && sha256sum "iems-${TAG}-source.tar.gz" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Create or update GitHub Release
        run: |
          OWNER_LOWER=$(echo "${OWNER_LC}" | tr '[:upper:]' '[:lower:]')
          cat > dist/release-notes.md <<EOF
          ## IEMS ${TAG}

          ### Container Images (GHCR)
          - \`ghcr.io/${OWNER_LOWER}/iems-api:${TAG}\`
          - \`ghcr.io/${OWNER_LOWER}/iems-web:${TAG}\`

          ### Verification
          Verify the source archive integrity using the attached \`SHA256SUMS.txt\`:
          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "dist/iems-${TAG}-source.tar.gz" "dist/SHA256SUMS.txt" --clobber
          else
            gh release create "${TAG}" "dist/iems-${TAG}-source.tar.gz" "dist/SHA256SUMS.txt" \
              --title "IEMS ${TAG}" \
              --notes-file dist/release-notes.md \
              --generate-notes
          fi
